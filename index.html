<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Mob Rush is a portrait arcade crowd shooter. Aim the cannon, multiply through gates, and break the enemy base." />
  <title>Mob Rush</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-phase="menu">
  <div id="safe-probe"></div>
  <div id="stage">
    <canvas id="game" width="400" height="780"></canvas>
    <header id="hud">
      <div class="stat">
        <span>SCORE</span>
        <b id="score">0</b>
      </div>
      <div class="stat mid">
        <span>LEVEL</span>
        <b id="level">1</b>
      </div>
      <div class="stat right">
        <span>BEST</span>
        <b id="best">0</b>
      </div>
      <div class="spacer"></div>
      <button id="mute" type="button" aria-pressed="false" aria-label="Toggle sound">SFX</button>
      <button id="restart" type="button">RESTART</button>
    </header>
    <div id="overlay">
      <div class="card">
        <p class="eyebrow">ARCADE</p>
        <h1 id="title">MOB RUSH</h1>
        <p id="blurb">Drag to aim. Hold to fire a crowd.</p>
        <dl class="help" id="help">
          <div><dt>x2 x3</dt><dd>multiply</dd></div>
          <div><dt>+10</dt><dd>add runners</dd></div>
          <div><dt>-5 /2</dt><dd>avoid these</dd></div>
        </dl>
        <p id="result" hidden></p>
        <button id="start" type="button">TAP TO START</button>
        <p class="hint" id="hint">Break their base. Don't let red reach your cannon.</p>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
